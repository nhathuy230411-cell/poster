  </defs>

  <!-- Clean Academic Vector Plate -->
  <rect x="2" y="2" width="1876" height="322" rx="16" ry="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- STEP 1: DATA ACQUISITION -->
  <g transform="translate(36, 26)">
    <rect width="326" height="178" rx="14" ry="14" fill="#F8FAFC" stroke="#475569" stroke-width="2.4"/>
