    <rect x="24" y="145" width="278" height="22" rx="5" fill="#E0F2FE"/>
    <text x="163" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0369A1" font-family="'IBM Plex Mono', Consolas, monospace">has_emer Flag • 23,41 ms</text>
