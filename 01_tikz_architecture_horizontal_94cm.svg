  <g transform="translate(410, 26)">
    <rect width="326" height="178" rx="14" ry="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.8"/>
    <rect x="18" y="14" width="204" height="28" rx="7" ry="7" fill="#0284C7"/>
    <text x="120" y="33" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">KHÂU 2 • NHẬN THỨC AI</text>
    <text x="163" y="70" text-anchor="middle" font-size="18.5" font-weight="800" fill="#0369A1">YOLOv12m &amp; ÁP SUẤT S</text>
    <line x1="24" y1="84" x2="302" y2="84" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="163" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0F172A">Phân loại 7 lớp xe Việt Nam (K_i)</text>
