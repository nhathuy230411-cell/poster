  <!-- 1 Hz Closed-Loop Feedback Bus -->
  <path d="M 1688 204 L 1688 278 L 199 278 L 199 212" fill="none" stroke="#059669" stroke-width="3.4" stroke-dasharray="12,7" marker-end="url(#arrEmerald)"/>

