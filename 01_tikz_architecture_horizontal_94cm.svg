    <text x="106" y="33" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">KHÂU 1 • THU THẬP</text>
    <text x="163" y="70" text-anchor="middle" font-size="18.5" font-weight="800" fill="#0F172A">DỮ LIỆU ĐẦU VÀO</text>
    <line x1="24" y1="84" x2="302" y2="84" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="163" y="108" text-anchor="middle" font-size="15.5" font-weight="500" fill="#334155">Luồng Camera 1080p / SUMO</text>
    <text x="163" y="132" text-anchor="middle" font-size="15" fill="#475569">Trích xuất tọa độ, vận tốc, ID</text>
    <rect x="24" y="145" width="278" height="22" rx="5" fill="#F1F5F9"/>
    <text x="163" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" font-family="'IBM Plex Mono', Consolas, monospace">input.py • HAL Interface</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="362" y1="115" x2="404" y2="115" stroke="#1E293B" stroke-width="3" marker-end="url(#arrSlate)"/>

