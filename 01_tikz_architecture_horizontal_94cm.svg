    <text x="116" y="33" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">KHÂU 5 • CHẤP HÀNH</text>
    <text x="156" y="70" text-anchor="middle" font-size="18.5" font-weight="800" fill="#065F46">CẬP NHẬT TÍN HIỆU</text>
    <line x1="22" y1="84" x2="290" y2="84" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="156" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0F172A">Truyền lệnh qua giao thức TraCI</text>
    <text x="156" y="132" text-anchor="middle" font-size="15" fill="#047857">Đồng bộ cụm đèn trục EW ⊥ NS</text>
    <rect x="22" y="145" width="268" height="22" rx="5" fill="#D1FAE5"/>
    <text x="156" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46" font-family="'IBM Plex Mono', Consolas, monospace">SUMO v1.27.1 • loop.py</text>
