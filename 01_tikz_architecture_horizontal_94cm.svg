    <rect x="18" y="14" width="208" height="28" rx="7" ry="7" fill="#D97706"/>
    <text x="122" y="33" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">KHÂU 4 • KHÓA AN TOÀN</text>
    <text x="163" y="70" text-anchor="middle" font-size="18.5" font-weight="800" fill="#B45309">BẢO VỆ CHUYỂN PHA</text>
    <line x1="24" y1="84" x2="302" y2="84" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="163" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0F172A">Duy trì 3s Đèn Vàng cố định</text>
