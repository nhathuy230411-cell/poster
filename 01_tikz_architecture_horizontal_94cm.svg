    <line x1="24" y1="84" x2="302" y2="84" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="163" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0F172A">Chu kỳ nền 100s (47s–3s–50s)</text>
