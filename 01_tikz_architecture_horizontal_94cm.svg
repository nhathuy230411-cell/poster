  <rect x="520" y="255" width="840" height="44" rx="22" ry="22" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
  <text x="940" y="283" text-anchor="middle" font-size="16.5" font-weight="800" fill="#065F46">
    VÒNG LẶP PHẢN HỒI KHÉP KÍN THỜI GIAN THỰC — TẦN SỐ QUÉT 1 Hz (Δt = 1,0s • AI chiếm 2,34% chu kỳ)
  </text>
